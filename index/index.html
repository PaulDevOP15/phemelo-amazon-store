<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phemelo Amazon Clone</title>
  <script src="../src/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="product.css" />
  <link rel="stylesheet" href="productOnSale.css" />
</head>
<body>
  <header class="header">
    <a
      href="index.html"
      id="nav-logo-sprites"
      class="nav-logo-link nav-progressive-attribute"
      aria-label="Amazon.co.za"
      lang="en"
    >
      <img
        class="nav-sprite nav-logo-base"
        src="https://m.media-amazon.com/images/I/61zYzaUw31L.png"
        alt=""
        width="164"
        height="52"
        decoding="async"
      />
      <span id="logo-ext" class="nav-sprite nav-logo-ext nav-progressive-content" aria-hidden="true"></span>
      <span class="nav-logo-locale">.co.za</span>
    </a>

    <div class="header_search">
      <input class="header_input" type="text" placeholder="Search Amazon products" />
      <i class="fa-solid fa-magnifying-glass search_icon" aria-hidden="true"></i>
    </div>

    <nav class="header_nav" aria-label="Main navigation">
      <a href="../login/login.html" class="header_link">
        <div class="header_option">
          <span class="header_optionOne">Hello phemelo@gmail.com</span>
          <span class="header_optionTwo">Sign Out</span>
        </div>
      </a>

      <a href="../cart/cart.html" class="header_link">
        <div class="header_option">
          <span class="header_optionOne">Returns</span>
          <span class="header_optionTwo">& Orders</span>
        </div>
      </a>

      <a href="../wishlist/wishlist.html" class="header_link" aria-label="Wishlist">
        <div class="header_option">
          <span class="header_optionOne">Your</span>
          <span class="header_optionTwo header_wishlist_label"><i class="fa-regular fa-heart" aria-hidden="true"></i> List</span>
        </div>
      </a>

      <a href="../cart/cart.html" class="header_link header_optionBasket" aria-label="Go to cart">
        <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
        <span class="header_optionTwo header_basketCount">0</span>
      </a>
      <button type="button" class="theme_toggle" aria-pressed="false">
        <i class="fa-solid fa-moon theme_toggle_icon_dark" aria-hidden="true"></i>
        <i class="fa-solid fa-sun theme_toggle_icon_light" aria-hidden="true"></i>
      </button>
    </nav>
  </header>

  <main class="home">
    <section class="hero" aria-hidden="true"></section>

    <section class="product_section" aria-label="Featured products">
      <h2 class="section_title">Featured products</h2>

      <div class="catalog_toolbar" id="catalog-toolbar" aria-label="Filter and sort catalog">
        <div class="catalog_toolbar_inner">
          <div class="catalog_block">
            <span class="catalog_label">Category</span>
            <div class="catalog_category_buttons">
              <button type="button" class="catalog_category_btn catalog_category_btn--active" data-category="all">All</button>
              <button type="button" class="catalog_category_btn" data-category="Electronics">Electronics</button>
              <button type="button" class="catalog_category_btn" data-category="Fashion">Fashion</button>
              <button type="button" class="catalog_category_btn" data-category="Home">Home</button>
              <button type="button" class="catalog_category_btn" data-category="Books">Books</button>
            </div>
            <label class="catalog_select_label" for="catalog-category">
              Browse category
              <select id="catalog-category" class="catalog_select">
                <option value="all">All categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
                <option value="Books">Books</option>
              </select>
            </label>
          </div>

          <div class="catalog_block catalog_block--narrow">
            <label class="catalog_select_label">
              Price range
              <select id="catalog-price-range" class="catalog_select">
                <option value="all">All prices</option>
                <option value="under50">Under $50</option>
                <option value="50-100">$50–$100</option>
                <option value="100-200">$100–$200</option>
                <option value="200plus">$200 &amp; above</option>
              </select>
            </label>
          </div>

          <div class="catalog_block catalog_block--narrow">
            <label class="catalog_select_label">
              Sort by
              <select id="catalog-sort" class="catalog_select">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating-desc">Avg. customer rating</option>
                <option value="name-asc">Name A–Z</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="product_grid" id="product-grid"></div>
    </section>
  </main>

  <script src="../src/products.js"></script>
  <script src="../src/cart.js"></script>
  <script src="../src/wishlist.js"></script>
  <script src="../src/app.js"></script>
</body>
</html>
