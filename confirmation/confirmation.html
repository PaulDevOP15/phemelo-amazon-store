<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmation</title>
  <script src="../src/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="confirmation.css" />
</head>
<body class="confirmation_body">
  <div class="confirmation_page">
    <header class="confirmation_strip">
      <div class="confirmation_strip_inner">
        <a href="../index/index.html" class="confirmation_logo_link" aria-label="Home">
          <img class="confirmation_logo_thumb" src="https://images-eu.ssl-images-amazon.com/images/G/53/ShoppingPortal/logo._TTD_.png" alt="" width="96" decoding="async" />
        </a>
        <button type="button" class="theme_toggle" aria-pressed="false">
          <i class="fa-solid fa-moon theme_toggle_icon_dark" aria-hidden="true"></i>
          <i class="fa-solid fa-sun theme_toggle_icon_light" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <article class="confirmation_card">
      <p class="confirmation_success"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Thank you!</p>
      <h1>Your demo order has been placed</h1>
      <p>Order reference number:</p>
      <div class="order_number_box" id="confirmation-order-number">—</div>
      <div id="confirmation-detail"></div>
      <p class="empty_message">We emailed a receipt to your fake inbox. This storefront does not ship real inventory.</p>
      <a class="continue_shopping_btn" href="../index/index.html">Continue shopping</a>
    </article>
  </div>

  <script src="../src/checkoutFlow.js"></script>
</body>
</html>
